name: Build APK

# Manual: Actions tab -> "Build APK" -> Run workflow.
# Also runs automatically when this file itself changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Android platform 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Add Capacitor (Android packaging)
        run: |
          npm install @capacitor/core@^7 @capacitor/android@^7
          npm install -D @capacitor/cli@^7

      - name: Build web app (root base for the app package)
        run: npx vite build --base=/

      - name: Init Capacitor and add Android project
        run: |
          npx cap init Jovro com.bakervai.jovro --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Set Jovro launcher icon
        run: |
          SRC=public/icons/icon-512.png
          RES=android/app/src/main/res
          rm -f $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            mkdir -p $RES/mipmap-$1
            convert "$SRC" -resize ${2}x${2} $RES/mipmap-$1/ic_launcher.png
            convert "$SRC" -resize ${2}x${2} $RES/mipmap-$1/ic_launcher_round.png
          done

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jovro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
