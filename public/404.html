<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Jovro</title>
  <script>
    const path = window.location.pathname.replace('/Jovro', '') || '/';
    const search = window.location.search;
    const hash = window.location.hash;
    window.location.replace('/Jovro/?p=' + encodeURIComponent(path + search) + hash);
  </script>
</head>
<body></body>
</html>
